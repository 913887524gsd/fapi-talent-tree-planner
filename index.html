<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talent Tree Planner</title>
    <link rel="stylesheet" href="./styles.css?v=2026.05.14" />
    <script defer src="./app.js?v=2026.05.14"></script>
  </head>
  <body>
    <div class="app-shell" id="app">
      <header class="panel topbar">
        <div class="title-group">
          <h1 data-i18n="title">Talent Tree Planner</h1>
        </div>

        <div class="topbar-actions">
          <label class="field compact">
            <span data-i18n="language">Language</span>
            <select id="languageSelect">
              <option value="auto" data-i18n="languageAuto">Auto</option>
              <option value="en">English</option>
              <option value="zh">简体中文</option>
            </select>
          </label>
        </div>
      </header>

      <section class="panel class-ribbon">
        <div class="section-heading">
          <h2 data-i18n="classSelector">Class</h2>
        </div>
        <div id="classSelector" class="class-selector"></div>
      </section>

      <section class="panel priority-card">
        <div class="section-heading">
          <h2 data-i18n="priorityTitle">Priority</h2>
          <div
            class="mode-switch"
            id="priorityModeSwitch"
            role="radiogroup"
            data-active-mode="strict"
          >
            <button
              type="button"
              class="mode-option active"
              id="priorityStrictModeButton"
              data-priority-mode="strict"
              role="radio"
              data-i18n="priorityModeStrict"
            >
              Strict
            </button>
            <button
              type="button"
              class="mode-option"
              id="priorityAdaptiveModeButton"
              data-priority-mode="adaptive"
              role="radio"
              data-i18n="priorityModeAdaptive"
            >
              Adaptive
            </button>
          </div>
        </div>

        <div id="priorityList" class="priority-list"></div>

        <div class="priority-editor" id="priorityEditor">
          <div class="priority-controls">
            <div class="priority-hints">
              <p class="priority-drag-hint" data-i18n="dragHintDesktop">Drag icons on desktop to sort</p>
              <p class="priority-drag-hint" data-i18n="doubleClickHint">Double click to enable/disable</p>
            </div>
            <button
              type="button"
              class="action-btn warning"
              id="priorityToggleButton"
              data-priority-action="toggle"
              data-i18n="disableTalent"
            >
              Disable
            </button>
            <button
              type="button"
              class="action-btn"
              data-priority-action="left"
              data-i18n="moveLeft"
            >
              Move Left
            </button>
            <button
              type="button"
              class="action-btn"
              data-priority-action="right"
              data-i18n="moveRight"
            >
              Move Right
            </button>
            <button
              type="button"
              class="action-btn danger"
              data-priority-action="reset"
              data-i18n="resetPriority"
            >
              Reset
            </button>
          </div>
        </div>
      </section>

      <main class="workspace">
        <section class="panel stage">
          <div class="section-heading stage-heading">
            <h2 id="stageTitle">Talent Tree</h2>
          </div>

          <div class="tree-status">
            <label class="status-pill status-input">
              <span data-i18n="points">Talent Points</span>
              <input id="pointsInput" type="number" min="0" max="10000" value="12" />
            </label>
            <div class="status-pill">
              <span data-i18n="currentStep">Step</span>
              <strong id="currentStepValue">0 / 12</strong>
            </div>
            <div class="stage-controls">
              <div class="control-actions">
                <button type="button" class="action-btn danger" data-action="reset" data-i18n="resetSim">
                  Reset Simulation
                </button>
                <button type="button" class="action-btn" data-action="prev" data-i18n="prevStep">
                  Previous
                </button>
                <button type="button" class="action-btn primary" data-action="next" data-i18n="nextStep">
                  Next
                </button>
                <button type="button" class="action-btn primary" data-action="next10" data-i18n="next10Steps">
                  Next 10
                </button>
              </div>
              <div class="step-control">
                <input id="stepRange" type="range" min="0" max="12" value="0" />
              </div>
              <label class="field stage-jump">
                <span data-i18n="jumpToStep">Jump to Step</span>
                <input id="stepInput" type="number" min="0" max="12" value="0" />
              </label>
            </div>
          </div>
          <section class="next-talents">
            <strong id="nextTalentsTitle" data-i18n="nextTalentsTitle">Next 10 Talents</strong>
            <div id="nextTalentsList" class="next-talents-list"></div>
          </section>
          <div id="treeBoard" class="tree-board"></div>
        </section>
      </main>

      <div class="msgbox-backdrop" id="msgboxBackdrop" hidden>
        <div
          class="msgbox"
          role="alertdialog"
        >
          <h2 id="msgboxTitle" data-i18n="msgboxTitle">Notice</h2>
          <p id="msgboxMessage" data-i18n="criticalTalentMsg">
            This talent is required by the current simulation.
          </p>
          <div class="msgbox-actions">
            <button type="button" class="action-btn primary" id="msgboxOkButton" data-i18n="msgboxOk">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
